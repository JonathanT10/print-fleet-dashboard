; Copy to config.ini and point at your fleet.
[snmp]
community = public
timeout = 2
retries = 1
; Canon iR-ADV devices commonly answer SNMPv1 ONLY - uncomment for those:
; version = 1
; Hard ceiling (seconds) on any single device's poll, so one unresponsive
; printer can never wedge the whole run - it's just recorded offline and the
; poll moves on. Defaults to a value scaled off timeout/retries; override here:
; device_timeout = 20
; How many printers to poll at the same time. Higher finishes a big fleet
; sooner; lower is gentler on a slow link.
; poll_at_once = 8

[devices]
; Display Name = ip (optionally ip:port)
Front Office = 10.0.10.21
Warehouse    = 10.0.10.22

[ranges]
; WHERE TO LOOK for printers you have not listed above. One place per line:
;   a subnet          Office    = 10.0.10.0/24
;   a span            Warehouse = 10.0.20.50-10.0.20.99
;   the same, short   Spares    = 10.0.20.50-99
;   just the one      Boardroom = 10.0.30.15
; Anything that answers the Printer MIB is added and polled from then on; a
; switch or a server that merely speaks SNMP is passed over, not recorded.
;
; This is a scan: an SNMP GET goes to every address in every place named here.
; That is ordinary traffic on a network you run, but on some networks it will
; show up in monitoring - your call, your VLANs. Leave this section empty and
; nothing is ever scanned. You can also fill it in from the console's Print
; fleet tab instead of editing this file.
; Office = 10.0.10.0/24

[discovery]
; How often to look again, in hours. 0 = only when asked (--discover).
; A place that has never been looked at is always looked at once, so adding
; one is never a silent no-op.
rescan_hours = 24
; Addresses to leave alone even if a scan finds them. Separate with ; or ,
ignore =
; Safety net: a place bigger than this many addresses is refused, not scanned.
; max_addresses = 1024
; How long to wait for an address to answer while looking (seconds), and how
; many to try at once. Looking is one cheap GET, so these are quick by design.
; timeout = 1
; scan_at_once = 64
